apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2 
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: opsci2025_tme4-backend
        imagePullPolicy: Never 
        ports:
        - containerPort: 8000
        env:
        - name: MONGO_URI
          value: "mongodb://mongodb-service:27017"
        - name: REDIS_HOST
          value: "redis"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: NodePort 
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30001