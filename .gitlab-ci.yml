image: alpine:latest

stages:
  - test
  - unit-test
  - deploy


test:
  stage: test
  image: alpine
  script:
    - echo "Vérification de la présence des fichiers..."
    # On vérifie dans ton dossier simple_app
    - if [ ! -f simple_app/index.html ]; then echo "Erreur - index.html est manquant !"; exit 1; fi
    - if [ ! -f simple_app/styles.css ]; then echo "Erreur - styles.css manquant !"; exit 1; fi
    - if [ ! -f simple_app/script.js ]; then echo "Erreur - script.js manquant !"; exit 1; fi    
    - echo "Tous les fichiers sont bien présents !"

unit-test:
  stage: unit-test
  script:
    - echo "Installation des dépendances Node.js (Jest, etc.)..."
    - npm install
    - echo "Lancement des tests unitaires avec Jest..."
    - npm test

deploy:
  stage: deploy
  script:
    - mkdir -p public
    - cp simple_app/index.html simple_app/styles.css simple_app/script.js public/
  artifacts:
    paths:
      - public
  only:
    - main
